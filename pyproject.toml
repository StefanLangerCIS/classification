[project]
name = "classification"
version = "0.1.0"
description = "Text classification using scikit-learn and transformer-based models"
authors = [
    {name = "stefan.langer@lmu.de"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scikit-learn (>=1.9.1,<2.0.0)",
    "pandas (>=3.1.1,<4.0.0)",
    "langdetect (>=1.0.9,<2.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "transformers (>=5.23.0,<6.0.0)",
    "datasets (>=5.2.0,<6.0.0)",
    "pydantic (>=2.14.3,<3.0.0)",
    "sentence-transformers (>=6.1.0,<7.0.0)",
    "matplotlib (>=3.11.2,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
]


[build-system]
requires = ["poetry-core>=2.5.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
black = "^26.10.1"
isort = "^9.0.2"
pytest = "^9.2.0"

